<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Grind2Give</title>
  <style>
    body {
      margin: 0;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    video {
      width: 100%;
      max-width: 600px;
      height: auto;
    }
  </style>
</head>
<body>
  <video id="kidVideo" autoplay playsinline controls>
    <source src="young-legends (1).mp4" type="video/mp4">
  </video>

  <script>
    const video = document.getElementById("kidVideo");
    video.volume = 1;

    video.addEventListener("ended", function () {
      window.location.href = "https://www.google.com";
    });

    video.play().catch(function() {
      console.log("Autoplay blocked");
    });
  </script>
</body>
</html>
