<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Join</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #000;
      color: #f7fff9;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container { max-width: 700px; padding: 20px; }
    video {
      width: 100%;
      max-width: 640px;
      border-radius: 16px;
      margin-bottom: 24px;
    }
    .form {
      margin-top: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-size: 1.1rem;
    }
    input[type="date"] {
      padding: 12px 16px;
      font-size: 1.1rem;
      border: none;
      border-radius: 10px;
      margin-bottom: 16px;
    }
    button {
      padding: 14px 28px;
      font-size: 1.1rem;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      background: #00e69a;
      color: #000;
    }
    .error {
      color: #ff6b6b;
      margin-top: 12px;
      font-weight: bold;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <video autoplay muted playsinline controls>
      <source src="age-gate.mp4" type="video/mp4">
    </video>
    <h2>Enter your date of birth</h2>
    <div class="form">
      <label for="dob">Date of Birth</label>
      <input type="date" id="dob" required>
      <br>
      <button onclick="checkAge()">Continue</button>
      <div class="error" id="error">You must be 18 or older to enter.</div>
    </div>
  </div>

  <script>
    function checkAge() {
      const dob = document.getElementById('dob').value;
      const error = document.getElementById('error');

      if (!dob) {
        error.textContent = "Please enter your date of birth.";
        error.style.display = "block";
        return;
      }

      const birthDate = new Date(dob);
      const today = new Date();
      let age = today.getFullYear() - birthDate.getFullYear();
      const monthDiff = today.getMonth() - birthDate.getMonth();

      if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < birthDate.getDate())) {
        age--;
      }

      if (age >= 18) {
        sessionStorage.setItem('ageVerified', 'true');
        window.location.href = 'ambassador.html';
      } else {
        window.location.href = 'kidzone.html';
      }
    }
  </script>
</body>
</html>
