<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>G2G Ambassador Program</title>
  <style>
    :root {
      --green: #00e69a;
      --green-deep: #00b37a;
      --gold: #f0d78c;
      --text: #f7fff9;
      --muted: #a8c4b8;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #000000;
      color: var(--text);
      line-height: 1.65;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: url("logo.jpg") center center / cover no-repeat;
      opacity: 0.15;
      z-index: -1;
    }

    .container {
      max-width: 920px;
      margin: 40px auto;
      padding: 40px 24px;
    }

    h1 {
      font-size: clamp(2.2rem, 5vw, 3rem);
      color: var(--green);
      text-align: center;
      margin: 0 0 8px;
      font-weight: 800;
    }

    .subtitle {
      text-align: center;
      color: var(--gold);
      margin: 4px 0 32px;
      font-size: 1.15rem;
    }

    #rules-section,
    #apply-section {
      display: none;
    }

    .video-wrap {
      max-width: 800px;
      margin: 32px auto;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(0, 230, 154, 0.2);
      background: #000;
    }

    video {
      width: 100%;
      height: auto;
      display: block;
    }

    .video-note {
      text-align: center;
      color: var(--gold);
      margin: 12px 0 28px;
      font-weight: 600;
    }

    .rules-scroll-box {
      max-width: 900px;
      height: 640px;
      margin: 40px auto;
      padding: 32px 40px;
      background: rgba(12, 18, 15, 0.75);
      border: 1px solid rgba(0, 230, 154, 0.2);
      border-radius: 16px;
      overflow-y: auto;
      backdrop-filter: blur(8px);
      line-height: 1.7;
      font-size: 1.05rem;
    }

    .rules-scroll-box h2 { color: var(--green); text-align: center; margin-top: 0; font-size: 1.6rem; }
    .rules-scroll-box h3 { color: var(--gold); margin: 28px 0 8px; font-size: 1.2rem; }
    .rules-scroll-box p, .rules-scroll-box li { color: var(--muted); }
    .rules-scroll-box strong { color: var(--text); }
    .rules-scroll-box ul { padding-left: 22px; margin-bottom: 16px; }

    #apply-section { text-align: center; margin-top: 28px; }
    #apply-section p { color: var(--gold); font-weight: 600; margin-bottom: 16px; }

    .cta {
      display: inline-block;
      background: var(--green);
      color: #000;
      font-weight: 700;
      padding: 14px 32px;
      border-radius: 50px;
      text-decoration: none;
      font-size: 1.1rem;
    }

    .cta:hover { background: var(--green-deep); }
  </style>
</head>
<body>
  <div class="container">
    <!-- Video Section (shows immediately) -->
    <div id="video-section">
      <h1>G2G Ambassador Program</h1>
      <div class="subtitle">Watch the video first</div>

      <div class="video-wrap">
        <video id="ambassador-video" controls playsinline autoplay>
          <source src="g2gairdrop.mp4" type="video/mp4">
          Your browser does not support the video tag.
        </video>
      </div>
      <div class="video-note" id="video-note">Please watch the full video to continue.</div>
    </div>

    <!-- Rules Section -->
    <div id="rules-section">
      <div class="rules-scroll-box" id="rules-box">
        <!-- Paste all your existing rules content here -->
      </div>
    </div>

    <!-- Apply Section -->
    <div id="apply-section">
      <p>Applying means you have watched the video and read the rules and guidelines.</p>
      <a class="cta" href="https://docs.google.com/forms/d/e/1FAIpQLScxNoH-jKaqRros4FAEp6aXWLrFB9qwq8W7m2_HwcTLD1w34Q/viewform?usp=header" target="_blank">Apply Now</a>
    </div>
  </div>

  <script>
    const video = document.getElementById('ambassador-video');

    // Try to autoplay on load
    window.addEventListener('load', () => {
      video.play().catch(() => {
        // Browser blocked autoplay – user can still press play
      });
    });

    // Unlock rules when video ends
    video.addEventListener('ended', () => {
      document.getElementById('video-note').innerText = "Video complete. Please read the rules below.";
      document.getElementById('rules-section').style.display = 'block';
      document.getElementById('rules-section').scrollIntoView({ behavior: 'smooth' });
    });

    // Unlock Apply when rules are scrolled to bottom
    const rulesBox = document.getElementById('rules-box');
    const applySection = document.getElementById('apply-section');

    rulesBox.addEventListener('scroll', () => {
      const atBottom = rulesBox.scrollHeight - rulesBox.scrollTop <= rulesBox.clientHeight + 40;
      if (atBottom) {
        applySection.style.display = 'block';
        applySection.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    });
  </script>
</body>
</html>
