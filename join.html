<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Join Grind2Give Rewards</title>
  <style>
    :root {
      --green: #00e69a;
      --gold: #f0d78c;
      --text: #f7fff9;
      --muted: #a8c4b8;
      --card: rgba(12, 18, 15, 0.85);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #000;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: url("joingate.jpg") center center / cover no-repeat;
      opacity: 0.12;
      z-index: -1;
    }
    .card {
      background: var(--card);
      border: 1px solid rgba(0, 230, 154, 0.2);
      border-radius: 20px;
      padding: 40px 30px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      backdrop-filter: blur(8px);
    }
    h1 {
      color: var(--green);
      margin: 0 0 10px;
      font-size: 1.8rem;
    }
    p { color: var(--muted); margin: 0 0 24px; }
    input[type="date"] {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid rgba(0, 230, 154, 0.3);
      background: #0a0f0d;
      color: var(--text);
      font-size: 1rem;
      margin-bottom: 20px;
    }
    button {
      width: 100%;
      padding: 14px;
      background: var(--green);
      color: #000;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { background: #00c884; }
    .error { color: #ff6b6b; margin-top: 12px; font-size: 0.9rem; display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Enter Your Birthday</h1>
    <p>Please confirm your date of birth to continue.</p>
    <input type="date" id="dob" />
    <button onclick="checkAge()">Continue</button>
    <div class="error" id="error">Please enter a valid date.</div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    if (params.get("bypass") === "art") {
      sessionStorage.setItem("g2g_age", "ok");
      window.location.href = "ambassador.html";
    }

    function checkAge() {
      const dob = document.getElementById("dob").value;
      const error = document.getElementById("error");
      if (!dob) {
        error.textContent = "Please enter your date of birth.";
        error.style.display = "block";
        return;
      }
      const birth = new Date(dob);
      const today = new Date();
      let age = today.getFullYear() - birth.getFullYear();
      const m = today.getMonth() - birth.getMonth();
      if (m < 0 || (m === 0 && today.getDate() < birth.getDate())) age--;

      if (age >= 18) {
        sessionStorage.setItem("g2g_age", "ok");
        window.location.href = "ambassador.html";
      } else {
        sessionStorage.setItem("g2g_age", "under");
        window.location.href = "kidzone.html";
      }
    }
  </script>
</body>
</html>
