      vi:  { title: "Tham gia Grind2Give Rewards", heading: "Nhập ngày sinh của bạn", sub: "Vui lòng xác nhận ngày sinh của bạn để tiếp tục.", btn: "Tiếp tục", errValid: "Vui lòng nhập ngày hợp lệ.", errDob: "Vui lòng nhập ngày sinh của bạn." },

      yo:  { title: "Darapọ̀ mọ́ Grind2Give Rewards", heading: "Tẹ Ọjọ́ Ìbí Rẹ", sub: "Jọ̀wọ́ jẹ́rìí ọjọ́ ìbí rẹ láti tẹ̀síwájú.", btn: "Tẹ̀síwájú", errValid: "Jọ̀wọ́ tẹ ọjọ́ tó tọ́.", errDob: "Jọ̀wọ́ tẹ ọjọ́ ìbí rẹ." },
      fa:  { title: "به Grind2Give Rewards بپیوندید", heading: "تاریخ تولد خود را وارد کنید", sub: "لطفاً برای ادامه، تاریخ تولد خود را تأیید کنید.", btn: "ادامه", errValid: "لطفاً یک تاریخ معتبر وارد کنید.", errDob: "لطفاً تاریخ تولد خود را وارد کنید." },
      it:  { title: "Unisciti a Grind2Give Rewards", heading: "Inserisci la tua data di nascita", sub: "Conferma la tua data di nascita per continuare.", btn: "Continua", errValid: "Inserisci una data valida.", errDob: "Inserisci la tua data di nascita." },
      ko:  { title: "Grind2Give Rewards 가입하기", heading: "생년월일을 입력하세요", sub: "계속하려면 생년월일을 확인해 주세요.", btn: "계속", errValid: "유효한 날짜를 입력해 주세요.", errDob: "생년월일을 입력해 주세요." },

      am:  { title: "ወደ Grind2Give Rewards ይቀላቀሉ", heading: "የልደት ቀንዎን ያስገቡ", sub: "ለመቀጠል እባክዎ የትውልድ ቀንዎን ያረጋግጡ።", btn: "ቀጥል", errValid: "እባክዎ ትክክለኛ ቀን ያስገቡ።", errDob: "እባክዎ የትውልድ ቀንዎን ያስገቡ።" }

    var RTL_LANGS = { ar: true, arz: true, fa: true, ur: true };
    var currentLang = "en";

    function detectLanguage() {
      var langs = [];
      if (navigator.languages && navigator.languages.length) langs = navigator.languages;
      else if (navigator.language) langs = [navigator.language];
      for (var i = 0; i < langs.length; i++) {
        var raw = (langs[i] || "").toLowerCase().replace("_", "-");
        if (!raw) continue;
        if (raw === "arz" || raw.indexOf("ar-eg") === 0) return "arz";
        if (raw === "pcm" || raw.indexOf("pcm-") === 0) return "pcm";
        if (raw.indexOf("fil") === 0) return "tl";
        var primary = raw.split("-")[0];
        if (primary === "fil") return "tl";
        if (TRANSLATIONS.hasOwnProperty(primary)) return primary;
        if (TRANSLATIONS.hasOwnProperty(raw)) return raw;
      }
      return "en";
    }

    function applyLanguage(code) {
      if (!TRANSLATIONS[code]) code = "en";
      currentLang = code;
      var t = TRANSLATIONS[code];
      document.documentElement.lang = code;
      document.documentElement.dir = RTL_LANGS[code] ? "rtl" : "ltr";
      document.title = t.title;
      document.getElementById("heading").textContent = t.heading;
      document.getElementById("subtext").textContent = t.sub;
      document.getElementById("continueBtn").textContent = t.btn;
      var err = document.getElementById("error");
      // Keep the currently shown message in sync if the error is visible,
      // otherwise keep the default "valid date" text translated.
      if (err.style.display === "block" && err.getAttribute("data-kind") === "dob") {
        err.textContent = t.errDob;
      } else {
        err.textContent = t.errValid;
      }
      var sel = document.getElementById("langSelect");
      if (sel && sel.value !== code) sel.value = code;
    }

    document.getElementById("langSelect").addEventListener("change", function() {
      applyLanguage(this.value);
    });

    applyLanguage(detectLanguage());

    var params = new URLSearchParams(window.location.search);
    if (params.get("bypass") === "art") {
      try { sessionStorage.setItem("g2g_age", "ok"); } catch (e) {}
      window.location.href = "ambassador.html";
    }

    function checkAge() {
      var dob = document.getElementById("dob").value;
      var error = document.getElementById("error");
      var t = TRANSLATIONS[currentLang] || TRANSLATIONS.en;
      if (!dob) {
        error.textContent = t.errDob;
        error.setAttribute("data-kind", "dob");
        error.style.display = "block";
        return;
      }
      var birth = new Date(dob);
      if (isNaN(birth.getTime())) {
        error.textContent = t.errValid;
        error.setAttribute("data-kind", "valid");
        error.style.display = "block";
        return;
      }
      var today = new Date();
      var age = today.getFullYear() - birth.getFullYear();
      var m = today.getMonth() - birth.getMonth();
      if (m < 0 || (m === 0 && today.getDate() < birth.getDate())) age--;

      if (age >= 18) {
        try { sessionStorage.setItem("g2g_age", "ok"); } catch (e) {}
        window.location.href = "ambassador.html";
      } else {
        try { sessionStorage.setItem("g2g_age", "under"); } catch (e) {}
        window.location.href = "kidzone.html";
      }
    }
