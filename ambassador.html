<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>G2G Ambassador Airdrop</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #000;
      color: #f7fff9;
      text-align: center;
    }
    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
    }
    video {
      width: 100%;
      max-width: 800px;
      border-radius: 16px;
      margin-bottom: 30px;
    }
    .apply-btn {
      display: none;
      background: #00e69a;
      color: #000;
      padding: 16px 32px;
      font-size: 1.2rem;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      text-decoration: none;
      margin-top: 20px;
    }
    .apply-btn.show {
      display: inline-block;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>G2G Ambassador Airdrop</h1>
    <p>Watch the message from the founder, then apply.</p>

    <video id="introVideo" controls>
      <source src="g2g-ambassador-compressed.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>

    <a href="https://docs.google.com/forms/d/e/1FAIpQLScxNoH-jKaqRros4FAEp6aXWLrFB9qwq8W7m2_HwcTLD1w34Q/viewform?usp=sharing&ouid=107306704861361388459" id="applyBtn" class="apply-btn" target="_blank" rel="noopener">Apply Here</a>
  </div>

  <script>
    const video = document.getElementById('introVideo');
    const applyBtn = document.getElementById('applyBtn');

    video.addEventListener('ended', function() {
      applyBtn.classList.add('show');
    });
  </script>
</body>
</html>
